<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能识别系统 - 主页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { background-color: #f0f2f6; min-height: 100vh; }
        .container { width: 100%; max-width: 1920px; margin: 0 auto; display: flex; flex-direction: column; }

        /* 顶部头部样式 */
        .header {
            width: 100%;
            background: #667eea;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { font-size: 24px; font-weight: 600; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        /* 头像样式 */
        .avatar-wrapper {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            overflow: hidden;
            position: relative;
        }
        .avatar img, .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* 头像降级处理：图片加载失败显示文字 */
        .avatar img.error + span,
        .avatar-preview img.error + span {
            display: block !important;
        }
        .avatar span, .avatar-preview span { z-index: 0; display: none; }

        /* 标签导航栏 */
        .tab-nav {
            width: 100%;
            display: flex;
            background: white;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
            white-space: nowrap;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .tab-nav-left { display: flex; }
        .tab-nav-right { padding-right: 10px; }
        .tab-item {
            padding: 18px 30px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0;
            font-size: 16px;
        }
        .tab-item.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }
        .tab-item:hover { background: #f8f9fa; }
        .ask-btn-header {
            padding: 6px 15px;
            background: #667eea;
            color: white;
            border: 1px solid #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .ask-btn-header:hover { background: #5a6edb; }

        /* 标签内容区 */
        .tab-content {
            width: 100%;
            flex: 1;
            min-height: calc(100vh - 140px);
            background: #f0f2f6;
        }
        .tab-panel {
            display: none;
            width: 100%;
            height: 100%;
            background: #f0f2f6;
        }
        /* 不同面板的display单独设置，避免!important冲突 */
        .tab-panel.active { display: block; }
        #knowledgePanel.active, #video-areaPanel.active { display: flex; flex-direction: column; }

        /* ========== 首页面板样式（仅轮播图上方保留搜索框） ========== */
        #homePanel {
            padding: 0 30px 20px;
            background: #f0f2f6;
        }
        /* 首页搜索框样式（与知识/视频专区搜索框保持一致） */
        .home-search-bar {
            padding: 15px 0;
            background: #fff;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }
        .search-btn {
            padding: 0 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .search-btn:hover {
            background: #5a6edb;
        }
        /* 轮播图容器（修改后） */
        .carousel-container-full {
            position: relative;
            width: 90%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            height: auto; /* 高度由比例自动计算 */
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .carousel-track {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .carousel-item-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            cursor: pointer;
        }
        .carousel-item-full.active {
            opacity: 1;
            z-index: 1;
        }
        .carousel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #222;
        }
        /* 轮播图加载失败提示（新增） */
        .carousel-bg::after {
            content: "图片加载失败";
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
        }
        .carousel-bg.load-error::after {
            display: block;
        }
        .carousel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
        }
        .carousel-content-full {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 60px;
            max-width: 700px;
        }
        .carousel-tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
            width: fit-content;
        }
        .carousel-content-full h2 {
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .carousel-content-full p {
            font-size: 16px;
            color: rgba(255,255,255,0.9);
            line-height: 1.8;
            margin-bottom: 30px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .carousel-action-btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: fit-content;
        }
        .carousel-action-btn:hover {
            background: #5a6edb;
            transform: scale(1.05);
        }
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-prev {
            left: 20px;
        }
        .carousel-next {
            right: 20px;
        }
        .carousel-arrow:hover {
            background: rgba(102, 126, 234, 0.9);
        }
        .carousel-dots {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .carousel-dot {
            width: 10px;
            height: 10px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }
        .carousel-dot.active {
            background: #667eea;
            width: 30px;
            border-radius: 5px;
        }
        .carousel-dot:hover {
            background: rgba(255,255,255,0.8);
        }

        /* ========== AI识别面板样式 ========== */
        #recognitionPanel { padding: 20px 30px; }
        /* 通用功能栏 */
        .function-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .function-btn {
            padding: 10px 20px;
            background: #f0f2f6;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .function-btn:hover { background: #e5e8ef; }
        .function-btn:disabled {
            background: #eee;
            cursor: not-allowed;
            color: #999;
        }
        /* 核心显示区域 */
        /* 核心显示区域 - 优化版 */
        .display-area {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: #e2e8f0;
            padding: 20px;
            min-height: 400px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        /* 空状态（未开始识别） */
        .display-area.display-empty {
            cursor: pointer;
        }
        .display-area.display-empty:hover {
            background: linear-gradient(135deg, #3a4556 0%, #252d3a 100%);
            transform: translateY(-2px);
        }
        .display-empty .empty-content {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .display-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.7;
        }
        .display-empty .empty-text {
            font-size: 18px;
            color: #a0aec0;
            margin-bottom: 8px;
        }
        .display-empty .empty-subtext {
            font-size: 14px;
            color: #718096;
        }

        /* 加载中状态（AI识别中） */
        .display-area.display-loading {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        .display-loading .loading-content {
            text-align: center;
        }
        .display-loading .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        .display-loading .loading-text {
            font-size: 16px;
            color: #a0aec0;
        }

        /* 结果状态（预览+识别结果） */
        .display-area.display-result {
            flex-direction: row;
            gap: 20px;
            padding: 20px;
            align-items: flex-start;
        }
        .display-result .media-preview {
            flex: 1;
            max-width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a202c;
            border-radius: 8px;
            padding: 10px;
        }
        .display-result .media-preview img,
        .display-result .media-preview video {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 4px;
        }
        .display-result .result-card {
            flex: 1;
            max-width: 50%;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }
        .display-result .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 12px;
        }
        .display-result .result-item {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .display-result .result-label {
            font-weight: bold;
            color: #cbd5e0;
        }
        .display-result .result-value {
            color: #e2e8f0;
        }

        /* 摄像头状态 */
        .display-area.display-camera {
            padding: 0;
            min-height: 400px;
        }
        .display-camera .camera-feed {
            width: 100%;
            height: 100%;
        }
        .display-camera .camera-controls {
            bottom: 20px;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 知识专栏面板样式 ========== */
        #knowledgePanel {
            height: calc(100vh - 140px);
            background: #fff;
            padding: 20px 30px;
        }
        .knowledge-search-bar {
            padding: 15px 0;
            background: #fff;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .knowledge-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #666;
            padding: 20px;
        }
        .knowledge-content i {
            font-size: 60px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .knowledge-content h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }
        .knowledge-content p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
        }

        /* ========== 视频专区面板样式 ========== */
        #video-areaPanel {
            height: calc(100vh - 140px);
            background: #fff;
            padding: 20px 30px;
        }
        .video-search-bar {
            padding: 15px 0;
            background: #fff;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .video-iframe-box {
            flex: 1;
            width: 100%;
            height: 70vh;
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .video-iframe-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========== 历史记录面板样式 ========== */
        #historyPanel {
            padding: 20px 30px;
            background: #fff;
            height: calc(100vh - 140px);
        }
        .history-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .history-column {
            flex: 1;
            min-width: 300px;
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .history-column h3 {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .history-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            line-height: 1.6;
        }
        .history-item .time {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        .history-item .media-preview {
            max-width: 100%;
            max-height: 150px;
            margin: 8px 0;
            border-radius: 4px;
            object-fit: contain;
            background: #222;
        }
        .history-item .result {
            font-size: 14px;
            color: #333;
        }
        .history-item .qa-content {
            font-size: 14px;
            color: #333;
        }
        .history-item .qa-question {
            color: #667eea;
            margin-bottom: 5px;
        }
        .history-item .qa-answer {
            color: #333;
        }

        /* 通用弹窗样式 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            /* 兼容性：backdrop-filter降级 */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .modal-content {
            width: 800px;
            min-width: 300px;
            min-height: 300px;
            max-width: 90vw;
            max-height: 90vh;
            background: white;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close-icon {
            cursor: pointer;
            color: #999;
            font-size: 20px;
            transition: all 0.2s;
        }
        .modal-close-icon:hover {
            color: #ff4444;
        }
        .modal-recognize {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 10px;
            resize: none;
            font-size: 14px;
            flex-shrink: 0;
        }
        .modal-question {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 15px;
            resize: none;
            font-size: 14px;
            flex-shrink: 0;
        }
        .modal-btn-group {
            flex-shrink: 0;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        .modal-submit {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }
        .modal-submit:hover {
            background: #5a6edb;
        }
        .modal-close {
            padding: 8px 20px;
            background: #ccc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: #bbb;
        }
        .modal-answer {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 5px;
            min-height: 100px;
            max-height: none;
            overflow-y: auto; /* 新增：长文本滚动 */
            font-size: 14px;
            line-height: 1.8;
            flex-grow: 1;
            word-wrap: break-word;
        }

        /* 设置弹窗样式 */
        .settings-modal .modal-content {
            width: 400px;
            min-height: auto;
        }
        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .settings-item:last-child {
            border-bottom: none;
        }
        .settings-label {
            font-size: 15px;
            color: #333;
        }
        .settings-value {
            font-size: 14px;
            color: #666;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .settings-btn {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .settings-btn:hover {
            background: #5a6edb;
        }
        .settings-btn.danger {
            background: #ff4444;
        }
        .settings-btn.danger:hover {
            background: #e63946;
        }
        .avatar-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #f0f2f6;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: bold;
            font-size: 20px;
            position: relative;
        }
        .nickname-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 14px;
        }

        /* 加载状态样式 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        /* 按钮禁用状态优化 */
        .btn-loading {
            cursor: not-allowed !important;
            opacity: 0.7 !important;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .camera-controls {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .camera-control-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .camera-control-btn.recording {
            background: #ff4444;
        }
        .status-box {
            margin: 10px 0;
            padding: 10px;
            background: #fff;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部头部 -->
    <div class="header">
        <h2>智能识别系统 - 欢迎您，<span id="usernameSpan">用户1</span></h2>
        <div class="header-right">

<script>
    // 模块化封装，避免全局污染
    const SmartRecognitionApp = (function() {
        // ========== 全局状态管理 ==========
        const AppState = {
            cameraStream: null,
            isRecognizing: false,
            isAnswering: false,
            isRecording: false,
            carouselInterval: null,
            currentCarouselIndex: 0,
            carouselItems: [],
            totalSlides: 0,
            blobUrls: [],
            currentImageSrc: null, // 👈 新增这一行，用于存储当前上传的图片
        };

        // ========== 工具函数 ==========
        function safeLocalStorage(key, value = undefined) {
            try {
                if (value === null) {
                    localStorage.removeItem(key);
                    return null;
                }
                if (value !== undefined) {
                    localStorage.setItem(key, typeof value === 'object' ? JSON.stringify(value) : value);
                    return value;
                }
                const item = localStorage.getItem(key);
                try {
                    return JSON.parse(item);
                } catch (e) {
                    return item;
                }
            } catch (e) {
                console.warn('本地存储操作失败：', e);
                alert('浏览器本地存储已禁用，部分功能可能无法正常使用！');
                return null;
            }
        }

        function getElement(selector) {
            const el = document.querySelector(selector);
            if (!el) console.warn(`元素不存在: ${selector}`);
            return el;
        }

        function revokeBlobUrls() {
            AppState.blobUrls.forEach(url => {
                try {
                    URL.revokeObjectURL(url);
                } catch (e) {
                    console.warn('释放Blob URL失败：', e);
                }
            });
            AppState.blobUrls = [];
        }

        // ========== 标签页切换函数 ==========
        function initTabSwitch() {
            const tabItems = document.querySelectorAll('.tab-item');
            const tabPanels = document.querySelectorAll('.tab-panel');

            tabItems.forEach(item => {
                item.addEventListener('click', () => {
                    tabItems.forEach(ti => ti.classList.remove('active'));
                    tabPanels.forEach(tp => tp.classList.remove('active'));
                    item.classList.add('active');
                    const tabId = item.dataset.tab;
                    const targetPanel = getElement(`#${tabId}Panel`);
                    if (targetPanel) targetPanel.classList.add('active');

                    if (tabId === 'video-area') {
                        const videoIframe = getElement('#videoIframe');
                        const videoInput = getElement('#videoSearchInput');
                        if (videoIframe && videoInput) {
                            videoIframe.src = `https://search.bilibili.com/all?keyword=${encodeURIComponent(videoInput.value)}`;
                        }
                    }
                });
            });
        }

        // ========== 全屏轮播逻辑（修改：动态从后端加载） ==========
        async function initFullCarousel() {
            const carouselTrack = getElement('#carouselTrack');
            const dotsContainer = getElement('#carouselDots');
            if(!carouselTrack || !dotsContainer) return;

            // 1. 从后端获取轮播图数据
            try {
                const res = await fetch('/api/carousel/list');
                const json = await res.json();
                if (json.code !== 0 || !json.data || json.data.length === 0) {
                    // 无数据时显示默认提示
                    carouselTrack.innerHTML = `
                <div class="carousel-item-full active">
                    <div class="carousel-bg" style="background-color:#222"></div>
                    <div class="carousel-overlay"></div>
                    <div class="carousel-content-full">
                        <h2>欢迎使用智能识别系统</h2>
                        <p>管理员可在后台配置轮播图内容</p>
                    </div>
                </div>
            `;
                    AppState.carouselItems = document.querySelectorAll('.carousel-item-full');
                    AppState.totalSlides = 1;
                    renderDots();
                    return;
                }

                // 2. 动态渲染轮播图HTML
                const carouselList = json.data;
                let html = '';
                carouselList.forEach((item, index) => {
                    html += `
                <div class="carousel-item-full ${index === 0 ? 'active' : ''}"
                     data-type="${item.type}" data-keyword="${item.keyword}">
                    <div class="carousel-bg"
                         style="background-image: url('${item.image_url}'), linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));"
                         onload="this.classList.remove('load-error')"
                         onerror="this.classList.add('load-error')">
                    </div>
                    <div class="carousel-overlay"></div>
                    <div class="carousel-content-full">
                        <span class="carousel-tag">${item.tag}</span>
                        <h2>${item.title}</h2>
                        <p>${item.description}</p>
                        <button class="carousel-action-btn">点击查看详情</button>
                    </div>
                </div>
            `;
                });
                carouselTrack.innerHTML = html;

                // 3. 初始化轮播状态
                AppState.carouselItems = document.querySelectorAll('.carousel-item-full');
                AppState.totalSlides = AppState.carouselItems.length;

                // 4. 渲染指示器
                renderDots();

                // 5. 绑定轮播事件
                bindCarouselEvents();

                // 6. 自动播放
                setTimeout(startAutoPlay, 500);

            } catch (err) {
                console.error('加载轮播图失败：', err);
                carouselTrack.innerHTML = `<div class="carousel-item-full active"><div class="carousel-bg" style="background-color:#222"></div><div class="carousel-content-full"><h2>轮播图加载失败</h2></div></div>`;
            }
        }

// 辅助函数：渲染指示器圆点
        function renderDots() {
            const dotsContainer = getElement('#carouselDots');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < AppState.totalSlides; i++) {
                const dot = document.createElement('div');
                dot.className = `carousel-dot ${i === 0 ? 'active' : ''}`;
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
        }

// 辅助函数：绑定轮播箭头/点击事件
        function bindCarouselEvents() {
            const prevBtn = getElement('#carouselPrev');
            const nextBtn = getElement('#carouselNext');
            const carouselContainer = getElement('#carouselContainer');

            prevBtn.onclick = () => { stopAutoPlay(); prevSlide(); setTimeout(startAutoPlay, 500); };
            nextBtn.onclick = () => { stopAutoPlay(); nextSlide(); setTimeout(startAutoPlay, 500); };

            carouselContainer.addEventListener('mouseenter', stopAutoPlay);
            carouselContainer.addEventListener('mouseleave', startAutoPlay);

            // 绑定轮播项点击事件
            AppState.carouselItems.forEach((item) => {
                item.addEventListener('click', () => handleCarouselItemClick(item));
                const btn = item.querySelector('.carousel-action-btn');
                btn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleCarouselItemClick(item);
                });
            });
        }
        // ========== 搜索功能逻辑 ==========
        function initSearchFunction() {
            const knowledgeInput = getElement('#knowledgeSearchInput');
            const knowledgeBtn = getElement('#knowledgeSearchBtn');
            const videoInput = getElement('#videoSearchInput');
            const videoBtn = getElement('#videoSearchBtn');
            const homeSearchInput = getElement('#homeSearchInput');
            const homeSearchBtn = getElement('#homeSearchBtn');

            function doKnowledgeSearch(keyword) {
                if(!keyword.trim()) return;
                const tabItems = document.querySelectorAll('.tab-item');
                const tabPanels = document.querySelectorAll('.tab-panel');
                tabItems.forEach(ti => ti.classList.remove('active'));
                tabPanels.forEach(tp => tp.classList.remove('active'));
                document.querySelector('[data-tab="knowledge"]').classList.add('active');
                const knowledgePanel = getElement('#knowledgePanel');
                if (knowledgePanel) knowledgePanel.classList.add('active');
                if (knowledgeInput) knowledgeInput.value = keyword;
            }

            function doVideoSearch(keyword) {
                if(!keyword.trim()) return;
                const tabItems = document.querySelectorAll('.tab-item');
                const tabPanels = document.querySelectorAll('.tab-panel');
                tabItems.forEach(ti => ti.classList.remove('active'));
                tabPanels.forEach(tp => tp.classList.remove('active'));
                document.querySelector('[data-tab="video-area"]').classList.add('active');
                const videoPanel = getElement('#video-areaPanel');
                if (videoPanel) videoPanel.classList.add('active');
                if (videoInput && getElement('#videoIframe')) {
                    videoInput.value = keyword;
                    getElement('#videoIframe').src = `https://search.bilibili.com/all?keyword=${encodeURIComponent(keyword)}`;
                }
            }

            function doHomeSearch(keyword) {
                const searchTypeSelect = getElement('#searchTypeSelect');
                if (!searchTypeSelect) return;
                const type = searchTypeSelect.value;
                const activeCarouselItem = document.querySelector('.carousel-item-full.active');
                const searchKeyword = keyword.trim() || (activeCarouselItem ? activeCarouselItem.dataset.keyword : '');
                if (!searchKeyword.trim()) {
                    alert('请输入搜索关键词！');
                    return;
                }
                if (type === 'knowledge') {
                    doKnowledgeSearch(searchKeyword);
                } else if (type === 'video') {
                    doVideoSearch(searchKeyword);
                }
            }

            if (homeSearchBtn && homeSearchInput) {
                homeSearchBtn.addEventListener('click', () => doHomeSearch(homeSearchInput.value));
                homeSearchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') doHomeSearch(homeSearchInput.value);
                });
            }
            if (knowledgeBtn && knowledgeInput) {
                knowledgeBtn.addEventListener('click', () => {
                    const keyword = knowledgeInput.value.trim();
                    if(keyword) alert(`已搜索关键词：${keyword}，可在知识专栏中查看相关内容`);
                });
                knowledgeInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const keyword = knowledgeInput.value.trim();
                        if(keyword) alert(`已搜索关键词：${keyword}，可在知识专栏中查看相关内容`);
                    }
                });
            }
            if (videoBtn && videoInput) {
                videoBtn.addEventListener('click', () => {
                    const keyword = videoInput.value.trim();
                    if(keyword && getElement('#videoIframe')) {
                        getElement('#videoIframe').src = `https://search.bilibili.com/all?keyword=${encodeURIComponent(keyword)}`;
                    }
                });
                videoInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const keyword = videoInput.value.trim();
                        if(keyword && getElement('#videoIframe')) {
                            getElement('#videoIframe').src = `https://search.bilibili.com/all?keyword=${encodeURIComponent(keyword)}`;
                        }
                    }
                });
            }
        }

        // ========== 摄像头与识别功能 ==========
        function initCameraFunctions() {
            const openCameraBtn = getElement('#openCameraBtn');
            const closeCameraBtn = getElement('#closeCameraBtn');
            const uploadImgBtn = getElement('#uploadImgBtn');
            const uploadVideoBtn = getElement('#uploadVideoBtn');
            const startRecogBtn = getElement('#startRecogBtn');
            const summaryBtn = getElement('#summaryBtn');
            const mainDisplay = getElement('#mainDisplay');
            const mainStatus = getElement('#mainStatus');
            const recogStatus = getElement('#recogStatus');
            const summaryStatus = getElement('#summaryStatus');
            const imgFileInput = getElement('#imgFileInput');
            const videoFileInput = getElement('#videoFileInput');

            const isMediaRecorderSupported = 'MediaRecorder' in window;
            const getSupportedMimeType = () => {
                const types = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
                for (const type of types) {
                    if (MediaRecorder.isTypeSupported(type)) return type;
                }
                return '';
            };

            if (mainDisplay) {
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    mainDisplay.addEventListener(eventName, preventDefaults, false);
                });
                function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

                mainDisplay.addEventListener('dragenter', () => {
                    mainDisplay.style.background = 'linear-gradient(135deg, #3a4556 0%, #252d3a 100%)';
                    mainDisplay.style.border = '2px dashed #667eea';
                });
                mainDisplay.addEventListener('dragleave', () => {
                    if (mainDisplay.classList.contains('display-empty')) {
                        mainDisplay.style.background = 'linear-gradient(135deg, #2d3748 0%, #1a202c 100%)';
                    }
                    mainDisplay.style.border = 'none';
                });
                mainDisplay.addEventListener('drop', (e) => {
                    mainDisplay.style.background = 'linear-gradient(135deg, #2d3748 0%, #1a202c 100%)';
                    mainDisplay.style.border = 'none';
                    const files = e.dataTransfer.files;
                    if (files.length === 0) return;
                    const file = files[0];
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            mainDisplay.className = 'display-area display-result';
                            mainDisplay.innerHTML = `
                        <div class="media-preview"><img src="${e.target.result}" alt="拖拽上传的图片"></div>
                        <div class="result-card">
                            <div class="result-title">文件信息</div>
                            <div class="result-item"><span class="result-label">文件名：</span><span class="result-value">${file.name}</span></div>
                            <div class="result-item"><span class="result-label">大小：</span><span class="result-value">${(file.size / 1024 / 1024).toFixed(2)} MB</span></div>
                            <div class="result-item"><span class="result-label">类型：</span><span class="result-value">${file.type}</span></div>
                        </div>
                    `;
                            mainStatus.textContent = `状态：已上传图片 - ${file.name}，可进行AI识别`;
                        };
                        reader.readAsDataURL(file);
                    } else if (file.type.startsWith('video/')) {
                        const videoUrl = URL.createObjectURL(file);
                        AppState.blobUrls.push(videoUrl);
                        mainDisplay.className = 'display-area display-result';
                        mainDisplay.innerHTML = `
                    <div class="media-preview"><video controls src="${videoUrl}" alt="拖拽上传的视频"></div>
                    <div class="result-card">
                        <div class="result-title">文件信息</div>
                        <div class="result-item"><span class="result-label">文件名：</span><span class="result-value">${file.name}</span></div>
                        <div class="result-item"><span class="result-label">大小：</span><span class="result-value">${(file.size / 1024 / 1024).toFixed(2)} MB</span></div>
                        <div class="result-item"><span class="result-label">类型：</span><span class="result-value">${file.type}</span></div>
                    </div>
                `;
                        mainStatus.textContent = `状态：已上传视频 - ${file.name}，可进行AI识别`;
                    } else {
                        alert('请拖拽图片或视频文件！');
                    }
                });

                mainDisplay.addEventListener('click', () => {
                    if (mainDisplay.classList.contains('display-empty')) {
                        const choice = confirm('请选择操作方式：\n- 确定：开启摄像头\n- 取消：上传文件');
                        if (choice) openCameraBtn.click();
                        else uploadImgBtn.click();
                    }
                });
            }

            if (openCameraBtn) {
                openCameraBtn.addEventListener('click', async () => {
                    try {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            alert('您的浏览器不支持摄像头功能，请使用Chrome、Edge等现代浏览器！');
                            return;
                        }
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                        AppState.cameraStream = stream;
                        if (mainDisplay) {
                            revokeBlobUrls();
                            mainDisplay.className = 'display-area display-camera';
                            mainDisplay.innerHTML = '';
                            const cameraFeed = document.createElement('div');
                            cameraFeed.className = 'camera-feed';
                            const video = document.createElement('video');
                            video.srcObject = stream;
                            video.autoplay = true;
                            video.playsInline = true;
                            cameraFeed.appendChild(video);
                            mainDisplay.appendChild(cameraFeed);
                            const controls = document.createElement('div');
                            controls.className = 'camera-controls';
                            controls.innerHTML = `
                        <button class="camera-control-btn" id="captureBtn" aria-label="拍照">拍照</button>
                        <button class="camera-control-btn" id="recordBtn" ${!isMediaRecorderSupported ? 'disabled title="浏览器不支持录制功能"' : ''} aria-label="录制视频">录制</button>
                    `;
                            mainDisplay.appendChild(controls);
                            const captureBtn = getElement('#captureBtn');
                            if (captureBtn) {
                                captureBtn.addEventListener('click', () => {
                                    const canvas = document.createElement('canvas');
                                    canvas.width = video.videoWidth;
                                    canvas.height = video.videoHeight;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                    const imgData = canvas.toDataURL('image/jpeg');
                                    mainDisplay.className = 'display-area display-result';
                                    mainDisplay.innerHTML = `
                                <div class="media-preview"><img src="${imgData}" alt="拍照结果"></div>
                                <div class="result-card">
                                    <div class="result-title">拍照结果</div>
                                    <div class="result-item"><span class="result-label">状态：</span><span class="result-value">已完成拍照，可进行AI识别</span></div>
                                </div>
                            `;
                                    mainStatus.textContent = `状态：已拍照，可进行AI识别`;
                                });
                            }
                            let mediaRecorder = null;
                            let recordedChunks = [];
                            const recordBtn = getElement('#recordBtn');
                            if (recordBtn && isMediaRecorderSupported) {
                                recordBtn.addEventListener('click', () => {
                                    if (recordBtn.classList.contains('recording')) {
                                        mediaRecorder.stop();
                                        recordBtn.classList.remove('recording');
                                        recordBtn.textContent = '录制';
                                        AppState.isRecording = false;
                                        mainStatus.textContent = `状态：已停止录制，可进行AI识别`;
                                    } else {
                                        recordedChunks = [];
                                        const mimeType = getSupportedMimeType();
                                        if (!mimeType) { alert('您的浏览器不支持任何视频录制格式'); return; }
                                        mediaRecorder = new MediaRecorder(stream, { mimeType });
                                        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                                        mediaRecorder.onstop = () => {
                                            const videoBlob = new Blob(recordedChunks, { type: mimeType });
                                            const videoUrl = URL.createObjectURL(videoBlob);
                                            AppState.blobUrls.push(videoUrl);
                                            mainDisplay.className = 'display-area display-result';
                                            mainDisplay.innerHTML = `
                                        <div class="media-preview"><video controls src="${videoUrl}" alt="录制视频"></div>
                                        <div class="result-card">
                                            <div class="result-title">录制结果</div>
                                            <div class="result-item"><span class="result-label">状态：</span><span class="result-value">已完成录制，可进行AI识别</span></div>
                                        </div>
                                    `;
                                        };
                                        mediaRecorder.start();
                                        recordBtn.classList.add('recording');
                                        recordBtn.textContent = '停止';
                                        AppState.isRecording = true;
                                        mainStatus.textContent = `状态：正在录制视频...`;
                                    }
                                });
                            }
                        }
                        openCameraBtn.disabled = true;
                        closeCameraBtn.disabled = false;
                        mainStatus.textContent = `状态：摄像头已开启，可拍照/录制后进行AI识别`;
                    } catch (err) {
                        console.error('开启摄像头失败：', err);
                        alert(`开启摄像头失败：${err.message}\n请检查摄像头权限或设备连接`);
                        mainStatus.textContent = `状态：开启摄像头失败 - ${err.message}`;
                    }
                });
            }

            if (closeCameraBtn) {
                closeCameraBtn.addEventListener('click', () => {
                    revokeBlobUrls();
                    if (AppState.cameraStream) {
                        AppState.cameraStream.getTracks().forEach(track => { track.stop(); track = null; });
                        AppState.cameraStream = null;
                    }
                    AppState.isRecording = false;
                    if (mainDisplay) {
                        mainDisplay.className = 'display-area display-empty';
                        mainDisplay.innerHTML = `
                    <div class="empty-content">
                        <div class="empty-icon">📷📁</div>
                        <div class="empty-text">请开启摄像头或上传文件进行识别</div>
                        <div class="empty-subtext">点击区域可快速选择操作方式</div>
                    </div>
                `;
                    }
                    openCameraBtn.disabled = false;
                    closeCameraBtn.disabled = true;
                    mainStatus.textContent = '状态：摄像头已关闭';
                    recogStatus.textContent = '识别状态：未开始';
                    summaryStatus.textContent = '总结报告：无';
                });
            }

            if (uploadImgBtn && imgFileInput) {
                uploadImgBtn.addEventListener('click', () => imgFileInput.click());
                imgFileInput.addEventListener('change', (e) => {
                    revokeBlobUrls();
                    const file = e.target.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) { alert('请选择有效的图片文件（JPG/PNG/GIF）'); return; }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        mainDisplay.className = 'display-area display-result';
                        mainDisplay.innerHTML = `
                    <div class="media-preview"><img src="${e.target.result}" alt="上传的图片"></div>
                    <div class="result-card">
                        <div class="result-title">文件信息</div>
                        <div class="result-item"><span class="result-label">文件名：</span><span class="result-value">${file.name}</span></div>
                        <div class="result-item"><span class="result-label">大小：</span><span class="result-value">${(file.size / 1024 / 1024).toFixed(2)} MB</span></div>
                        <div class="result-item"><span class="result-label">类型：</span><span class="result-value">${file.type}</span></div>
                    </div>
                `;
                        mainStatus.textContent = `状态：已上传图片 - ${file.name}，可进行AI识别`;
                        imgFileInput.value = '';
                    };
                    reader.readAsDataURL(file);
                });
            }

            if (uploadVideoBtn && videoFileInput) {
                uploadVideoBtn.addEventListener('click', () => videoFileInput.click());
                videoFileInput.addEventListener('change', (e) => {
                    revokeBlobUrls();
                    const file = e.target.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('video/')) { alert('请选择有效的视频文件（MP4/AVI/MOV）'); return; }
                    const videoUrl = URL.createObjectURL(file);
                    AppState.blobUrls.push(videoUrl);
                    mainDisplay.className = 'display-area display-result';
                    mainDisplay.innerHTML = `
                <div class="media-preview"><video controls src="${videoUrl}" alt="上传的视频"></div>
                <div class="result-card">
                    <div class="result-title">文件信息</div>
                    <div class="result-item"><span class="result-label">文件名：</span><span class="result-value">${file.name}</span></div>
                    <div class="result-item"><span class="result-label">大小：</span><span class="result-value">${(file.size / 1024 / 1024).toFixed(2)} MB</span></div>
                    <div class="result-item"><span class="result-label">类型：</span><span class="result-value">${file.type}</span></div>
                </div>
            `;
                    mainStatus.textContent = `状态：已上传视频 - ${file.name}，可进行AI识别`;
                    videoFileInput.value = '';
                });
            }

            // ======================
            // 🔥 核心修改：调用后端接口
            // ======================
            if (startRecogBtn) {
                startRecogBtn.addEventListener('click', async () => {
                    if (AppState.isRecognizing) {
                        AppState.isRecognizing = false;
                        startRecogBtn.textContent = '开始AI识别';
                        recogStatus.textContent = '识别状态：已停止识别';
                        mainStatus.textContent = '状态：识别已停止';
                        return;
                    }

                    const imgElement = mainDisplay.querySelector('img');
                    if (!imgElement) {
                        alert('请先上传图片或拍照后再进行识别！（当前仅支持图片识别）');
                        return;
                    }

                    // 获取登录 token
                    const token = sessionStorage.getItem('token') || sessionStorage.getItem('admin_token');
                    if (!token) {
                        alert('请先登录！');
                        window.location.href = '/frontend/login.html';
                        return;
                    }

                    AppState.isRecognizing = true;
                    startRecogBtn.textContent = '停止AI识别';
                    recogStatus.textContent = '识别状态：正在调用后端模型识别中...';
                    mainStatus.textContent = '状态：AI正在分析，请稍候...';
                    mainDisplay.className = 'display-area display-loading';
                    mainDisplay.innerHTML = `
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在连接服务器，模型推理中...</div>
            </div>
        `;

                    try {
                        // 1. 获取图片元素
                        const imgElement = mainDisplay.querySelector('img');
                        if (!imgElement) {
                            alert('请先上传图片！');
                            return;
                        }

                        // 2. 调用后端识别接口
                        const res = await fetch('/api/ai/recognize', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                fileType: 'image',
                                mediaUrl: imgElement.src
                            })
                        });

                        if (!res.ok) throw new Error('服务器响应错误');
                        const json = await res.json();
                        if (json.code !== 0) throw new Error(json.msg);

                        // 3. 解析结果
                        const data = json.data;

                        // 更新状态文字
                        recogStatus.textContent = `识别状态：${data.result}`;
                        mainStatus.textContent = '状态：识别完成';

                        // 步骤 A：先清空显示区域，设置状态
                        mainDisplay.className = 'display-area display-result';
                        mainDisplay.innerHTML = '';

                        // 步骤 B：创建左侧预览容器
                        const mediaPreview = document.createElement('div');
                        mediaPreview.className = 'media-preview';
                        const newImg = document.createElement('img');
                        newImg.src = imgElement.src;
                        newImg.alt = '识别图片';
                        mediaPreview.appendChild(newImg);

                        // 步骤 C：创建右侧结果卡片
                        const resultCard = document.createElement('div');
                        resultCard.className = 'result-card';
                        resultCard.innerHTML = `
                <div class="result-title">🌾 识别结果</div>
                <div class="result-item">
                    <span class="result-label">识别结果：</span>
                    <span class="result-value">${data.result}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">总结：</span>
                    <span class="result-value">${data.summary}</span>
                </div>
            `;

                        // 步骤 D：组装到主显示区
                        mainDisplay.appendChild(mediaPreview);
                        mainDisplay.appendChild(resultCard);

                    } catch (err) {
                        console.error("❌ 识别失败：", err);
                        alert(`识别失败：${err.message}\n请确保后端服务已启动 (node app.js)`);

                        mainDisplay.className = 'display-area display-empty';
                        mainDisplay.innerHTML = `
                <div class="empty-content">
                    <div class="empty-icon">❌</div>
                    <div class="empty-text">识别失败</div>
                    <div class="empty-subtext">${err.message}</div>
                </div>
            `;
                    } finally {
                        AppState.isRecognizing = false;
                        startRecogBtn.textContent = '开始AI识别';
                    }
                });
            }

            if (summaryBtn) {
                summaryBtn.addEventListener('click', () => {
                    if (!recogStatus.textContent.includes('识别完成')) { alert('请先完成AI识别后再生成总结报告！'); return; }
                    summaryStatus.textContent = '总结报告：正在生成中...';
                    mainStatus.textContent = '状态：正在生成总结报告...';
                    setTimeout(() => {
                        const mockSummary = `### 水稻病害识别总结报告\n识别时间：${new Date().toLocaleString()}\n识别类型：图片识别\n病害名称：水稻稻瘟病（叶瘟型）\n发病程度：轻度\n核心症状：叶片出现暗绿色水渍状小斑，逐渐扩大为梭形病斑，外围有黄色晕圈\n防治建议：\n1. 农业防治：及时清除病株残体，合理密植，避免偏施氮肥\n2. 化学防治：使用20%三环唑可湿性粉剂1000倍液，或40%稻瘟灵乳油800倍液，每亩喷施50-60公斤药液\n3. 施药时机：发病初期施药，间隔7-10天再喷一次，连续防治2-3次\n注意事项：施药时选择晴天无风时段，严格按照药剂使用说明操作，避免药害`;
                        summaryStatus.textContent = `总结报告：生成完成（点击查看）`;
                        summaryStatus.style.cursor = 'pointer';
                        summaryStatus.addEventListener('click', () => { alert('总结报告：\n' + mockSummary); });
                        mainStatus.textContent = '状态：总结报告已生成';
                    }, 2000);
                });
            }
        }

        // ========== 历史记录功能 ==========
        function initHistoryFunctions() {
            const loadRecognitionHistoryBtn = getElement('#loadRecognitionHistoryBtn');
            const clearRecognitionHistoryBtn = getElement('#clearRecognitionHistoryBtn');
            const loadQAHistoryBtn = getElement('#loadQAHistoryBtn');
            const clearQAHistoryBtn = getElement('#clearQAHistoryBtn');
            const recognitionHistoryList = getElement('#recognitionHistoryList');
            const qaHistoryList = getElement('#qaHistoryList');

            if (loadRecognitionHistoryBtn && recognitionHistoryList) {
                loadRecognitionHistoryBtn.addEventListener('click', async () => {
                    const token = sessionStorage.getItem('token') || sessionStorage.getItem('admin_token');
                    if (!token) {
                        alert('请先登录！');
                        window.location.href = '/frontend/login.html';
                        return;
                    }

                    try {
                        const res = await fetch('/api/user/records', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const json = await res.json();
                        if (json.code !== 0) throw new Error(json.msg);

                        const history = json.data || [];

                            recognitionHistoryList.innerHTML = '<div>暂无识别记录</div>';

                            historyItem.className = 'history-item';

                    <div class="time">${item.create_time || item.createdAt}</div>

                    ${item.input_content ? `<img src="${item.input_content}" class="media-preview" alt="预览图">` : ''}
                    <div class="result">${item.result_content}</div>

                            recognitionHistoryList.appendChild(historyItem);
                        });

                        console.error("❌ 加载识别记录失败：", err);

                        safeLocalStorage('recognitionHistory', null);

                        alert('识别记录已清空');
                    }
                });

                        safeLocalStorage('qaHistory', null);
                        qaHistoryList.innerHTML = '<div>暂无问答记录</div>';

                });

            const modalQuestion = getElement('#modalQuestion');
            const modalAnswer = getElement('#modalAnswer');
            const recogStatus = getElement('#recogStatus');

            window.openModal = function() {
                if (modalMask) {
                    if (modalRecognize && recogStatus.textContent.includes('识别完成')) {
                        modalRecognize.value = recogStatus.textContent.replace('识别状态：识别完成 - ', '');
                    } else {
                        modalRecognize.value = '暂无识别结果，请先完成AI识别';
                    }
                    modalMask.style.display = 'flex';
                    modalQuestion.focus();
                    modalAnswer.textContent = '等待回答...';
                }
            };
            window.closeModal = function() {
                if (modalMask) {
                    modalMask.style.display = 'none';
                    modalQuestion.value = '';
                    AppState.isAnswering = false;
                }
            };
            window.submitQuestion = function() {
                if (AppState.isAnswering) return;
                const question = modalQuestion.value.trim();
                if (!question) {
                    alert('请输入您的问题！');
                    modalQuestion.focus();
                    return;
                }
                AppState.isAnswering = true;

                        '稻瘟病的发病条件是什么？': '稻瘟病发病条件：1. 温度：20-30℃最适宜发病；2. 湿度：相对湿度90%以上，持续阴雨天气易爆发；3. 栽培管理：偏施氮肥、田间郁闭、排水不良会加重发病；4. 品种抗性：感病品种发病重。',
                        '如何预防稻瘟病？': '稻瘟病预防措施：1. 选用抗病品种；2. 种子消毒：用20%三环唑可湿性粉剂500倍液浸种24小时；3. 合理密植，改善田间通风透光条件；4. 科学施肥，增施磷钾肥；5. 发病前喷施保护性药剂，如75%三环唑可湿性粉剂。'
                    };
                    const answer = mockAnswers[question] || `关于您的问题"${question}"，建议：1. 及时清除病株，防止病害扩散；2. 根据发病程度选择合适的药剂；3. 遵循农药使用安全间隔期；4. 必要时咨询当地农业技术推广站专家。`;
                    modalAnswer.textContent = answer;
                    AppState.isAnswering = false;
                    const qaHistory = safeLocalStorage('qaHistory') || [];
                    qaHistory.unshift({
                        time: new Date().toLocaleString(),
                        question: question,
                        answer: answer
                    });
                    if (qaHistory.length > 20) qaHistory.pop();
                    safeLocalStorage('qaHistory', qaHistory);
                }, 2000);
            };
            if (modalMask) {
                modalMask.addEventListener('click', (e) => {
                    if (e.target === modalMask) closeModal();
                });

            const settingsUsername = getElement('#settingsUsername');
            const nicknameInput = getElement('#nicknameInput');
            const saveNicknameBtn = getElement('#saveNicknameBtn');
            const changeAvatarBtn = getElement('#changeAvatarBtn');
            const avatarFileInput = getElement('#avatarFileInput');
            const changePwdBtn = getElement('#changePwdBtn');
            const changePwdForm = getElement('#changePwdForm');
            const savePwdBtn = getElement('#savePwdBtn');
            const cancelPwdBtn = getElement('#cancelPwdBtn');
            const logoutBtnInSettings = getElement('#logoutBtnInSettings');

            if (avatarWrapper && settingsModalMask) {
                avatarWrapper.addEventListener('click', () => {
                    settingsModalMask.style.display = 'flex';
                    if (previewAvatarImg && avatarImg) previewAvatarImg.src = avatarImg.src;
                    if (nicknameInput && usernameSpan) nicknameInput.value = usernameSpan.textContent;
                });
            }
            window.closeSettingsModal = function() {
                if (settingsModalMask) {
                    settingsModalMask.style.display = 'none';
                    changePwdForm.style.display = 'none';
                }
            };
            if (changeAvatarBtn && avatarFileInput) {
                changeAvatarBtn.addEventListener('click', () => avatarFileInput.click());
                avatarFileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file || !file.type.startsWith('image/')) {
                        alert('请选择有效的图片文件！');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if (previewAvatarImg) previewAvatarImg.src = e.target.result;
                        if (avatarImg) {
                            avatarImg.src = e.target.result;
                            avatarImg.classList.remove('error');
                        }
                        safeLocalStorage('userAvatar', e.target.result);
                    };
                    reader.readAsDataURL(file);
                    avatarFileInput.value = '';
                });
            }
            if (saveNicknameBtn && nicknameInput && usernameSpan) {
                saveNicknameBtn.addEventListener('click', () => {
                    const newNickname = nicknameInput.value.trim();
                    if (!newNickname) {
                        alert('昵称不能为空！');
                        return;
                    }
                    usernameSpan.textContent = newNickname;
                    settingsUsername.textContent = newNickname;
                    safeLocalStorage('userNickname', newNickname);
                    alert('昵称修改成功！');
                });
            }
            if (changePwdBtn && changePwdForm) {
                changePwdBtn.addEventListener('click', () => {
                    changePwdForm.style.display = changePwdForm.style.display === 'none' ? 'flex' : 'none';
                });
            }
            if (cancelPwdBtn && changePwdForm) {
                cancelPwdBtn.addEventListener('click', () => {
                    changePwdForm.style.display = 'none';
                    getElement('#oldPwd').value = '';
                    getElement('#newPwd').value = '';
                    getElement('#confirmPwd').value = '';
                });
            }
            if (savePwdBtn) {
                savePwdBtn.addEventListener('click', () => {
                    const oldPwd = getElement('#oldPwd').value;
                    const newPwd = getElement('#newPwd').value;
                    const confirmPwd = getElement('#confirmPwd').value;
                    if (!oldPwd || !newPwd || !confirmPwd) {
                        alert('请填写所有密码字段！');
                        return;
                    }
                    if (newPwd.length < 6) {
                        alert('新密码长度不能少于6位！');
                        return;
                    }
                    if (newPwd !== confirmPwd) {
                        alert('两次输入的新密码不一致！');
                        return;
                    }
                    alert('密码修改成功！请重新登录');
                    changePwdForm.style.display = 'none';
                    getElement('#oldPwd').value = '';
                    getElement('#newPwd').value = '';
                    getElement('#confirmPwd').value = '';
                });
            }
            if (logoutBtnInSettings) {
                logoutBtnInSettings.addEventListener('click', () => {
                    if (confirm('确定要退出登录吗？')) {
                        revokeBlobUrls();
                        if (AppState.cameraStream) {
                            AppState.cameraStream.getTracks().forEach(track => track.stop());
                            AppState.cameraStream = null;
                        }
                        AppState.isRecognizing = false;
                        AppState.isAnswering = false;
                        AppState.isRecording = false;
                        stopAutoPlay();
                        closeSettingsModal();
                        alert('已成功退出登录！');
                    }
                });
            }
            if (settingsModalMask) {
                settingsModalMask.addEventListener('click', (e) => {
                    if (e.target === settingsModalMask) closeSettingsModal();
                });
            }
            const savedAvatar = safeLocalStorage('userAvatar');
            const savedNickname = safeLocalStorage('userNickname');
            if (savedAvatar && avatarImg) {
                avatarImg.src = savedAvatar;
                avatarImg.classList.remove('error');
            }
            if (savedNickname && usernameSpan) {
                usernameSpan.textContent = savedNickname;
                settingsUsername.textContent = savedNickname;
            }
        }

        function initApp() {
            initTabSwitch();
            initFullCarousel();
            initSearchFunction();
            initCameraFunctions();
            initHistoryFunctions();
            initModalFunctions();
            initSettingsModal();

            window.addEventListener('beforeunload', () => {
                stopAutoPlay();
                revokeBlobUrls();
                if (AppState.cameraStream) {
                    AppState.cameraStream.getTracks().forEach(track => track.stop());
                }
            });
            console.log('智能识别系统初始化完成！');
        }

        return { init: initApp };
    })();

    document.addEventListener('DOMContentLoaded', () => {
        SmartRecognitionApp.init();
    });
</script>
</body>
</html>
